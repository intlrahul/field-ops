openapi: 3.0.3
info:
  title: FieldOps API
  version: 0.1.0
  description: Foundation only. Authentication and domain endpoints are not implemented.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service and database readiness
      security: []
      responses:
        '200':
          description: Database is accessible and migration metadata exists
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example: {status: ok}
        '503':
          description: Persistence is unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: object
                    additionalProperties: false
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [SERVICE_UNAVAILABLE]
                      message:
                        type: string
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Service temporarily unavailable
